name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "31 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on Trivy findings
        if: steps.trivy.outcome == 'failure'
        run: exit 1

  mcp-scan:
    name: MCP prompt-safety scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MCP package
        run: pnpm build

      - name: Scan MCP tool metadata
        id: mcp_scan
        continue-on-error: true
        run: npx -y @agentdefenders/mcp-scan@0.5.0-alpha --config .github/mcp-scan.json --format sarif --fail-on high --ci --quiet > mcp-scan.sarif

      - name: Upload MCP scan SARIF
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: mcp-scan.sarif

      - name: Fail on MCP scan findings
        if: steps.mcp_scan.outcome == 'failure'
        run: exit 1
